trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: CI
  displayName: 'Build Angular'
  jobs:
  - job: BuildAngular
    displayName: 'npm ci + ng build producao'
    steps:
    - task: NodeTool@0
      displayName: 'Node.js 22'
      inputs:
        versionSpec: '22.x'
    - script: npm ci
      displayName: 'Instalar dependencias'
    - script: npm run build
      displayName: 'Build producao (usa environment.prod.ts)'
    - task: PublishBuildArtifacts@1
      displayName: 'Publicar dist'
      inputs:
        pathToPublish: 'dist/nutryon-app/browser'
        artifactName: 'frontend-dist'

- stage: CD
  displayName: 'Deploy Azure Static Web Apps'
  dependsOn: CI
  jobs:
  - deployment: DeployFrontend
    displayName: 'Deploy para producao'
    environment: 'producao'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - task: AzureStaticWebApp@0
            displayName: 'Deploy no Azure Static Web Apps'
            inputs:
              azure_static_web_apps_api_token: '$(AZURE_STATIC_WEB_APPS_TOKEN)'
              app_location: '/'
              output_location: 'dist/nutryon-app/browser'
