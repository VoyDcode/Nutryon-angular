trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:

- stage: CI
  displayName: 'Build Angular'
  jobs:
  - job: BuildAngular
    displayName: 'npm ci + ng build producao'
    steps:
    - task: NodeTool@0
      displayName: 'Node.js 22'
      inputs:
        versionSpec: '22.x'
    - script: npm ci
      displayName: 'Instalar dependencias'
    - script: npm run build
      displayName: 'Build producao (usa environment.prod.ts)'
    - task: PublishBuildArtifacts@1
      displayName: 'Publicar dist'
      inputs:
        pathToPublish: 'dist/nutryon-app/browser'
        artifactName: 'frontend-dist'

- stage: CD
  displayName: 'Deploy Azure Static Web Apps'
  dependsOn: CI
  jobs:
  - deployment: DeployFrontend
    displayName: 'Deploy para producao'
    environment: 'producao'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: NodeTool@0
            displayName: 'Node.js 22'
            inputs:
              versionSpec: '22.x'
          - task: AzureCLI@2
            displayName: 'Deploy via SWA CLI (token do Azure)'
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                SWA_TOKEN=$(az staticwebapp secrets list \
                  --name Nutryon-angular \
                  --resource-group nutryon-rg \
                  --query "properties.apiKey" -o tsv)
                echo "Token obtido com sucesso"
                npx --yes @azure/static-web-apps-cli deploy \
                  "$(Pipeline.Workspace)/frontend-dist" \
                  --deployment-token "$SWA_TOKEN" \
                  --env production
